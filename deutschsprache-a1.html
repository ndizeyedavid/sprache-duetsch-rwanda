<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deutsch A1 Kursprogramm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: a sticky left rail of coloured unit tabs — the painted page edges of a printed Kursbuch — beside a single reading column; the rail folds into a horizontal tab strip under 900px. */
:root{
  --paper:#f7f8f6; --surface:#ffffff; --surface-2:#f1f3f0;
  --ink:#19212a; --ink-2:#55636e; --ink-3:#7d8b95;
  --line:#dde2df; --line-strong:#c4ccc7;
  --accent:#1f4fa8; --accent-ink:#ffffff; --accent-soft:#e8eefa;
  --ok:#1f6b4d; --ok-soft:#e3f2ea; --no:#9e2b3c; --no-soft:#fbe8ea;
  --der:#21579c; --die:#a63452; --das:#1f6b4d;
  --m1:#a8432f; --m2:#9c6a1e; --m3:#6f7d22; --m4:#26795c;
  --m5:#2a6e8d; --m6:#39569f; --m7:#654594; --m8:#933764;
  --shadow:0 1px 2px rgba(20,30,40,.05),0 8px 24px -16px rgba(20,30,40,.25);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --wrap:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f141a; --surface:#161d25; --surface-2:#1d262f;
  --ink:#e7edf1; --ink-2:#a2b0ba; --ink-3:#7d8b95;
  --line:#28323c; --line-strong:#3a4752;
  --accent:#86aaf2; --accent-ink:#0f141a; --accent-soft:#1c2941;
  --ok:#6cc79b; --ok-soft:#142c22; --no:#e98a98; --no-soft:#2e1a1e;
  --der:#7fa9e4; --die:#e3899d; --das:#6cc79b;
  --m1:#d4836c; --m2:#c9a04f; --m3:#a7b455; --m4:#5cb995;
  --m5:#5ea8c9; --m6:#7e96de; --m7:#a383d6; --m8:#d076a2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f141a; --surface:#161d25; --surface-2:#1d262f;
  --ink:#e7edf1; --ink-2:#a2b0ba; --ink-3:#7d8b95;
  --line:#28323c; --line-strong:#3a4752;
  --accent:#86aaf2; --accent-ink:#0f141a; --accent-soft:#1c2941;
  --ok:#6cc79b; --ok-soft:#142c22; --no:#e98a98; --no-soft:#2e1a1e;
  --der:#7fa9e4; --die:#e3899d; --das:#6cc79b;
  --m1:#d4836c; --m2:#c9a04f; --m3:#a7b455; --m4:#5cb995;
  --m5:#5ea8c9; --m6:#7e96de; --m7:#a383d6; --m8:#d076a2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.shell{max-width:var(--wrap);margin:0 auto;padding-inline:20px;padding-block:0}

/* ── top bar ─────────────────────────────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--wrap);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:1px 5px}
.top-sp{flex:1 1 40px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.ghost:hover{border-color:var(--line-strong);color:var(--ink)}
.ghost[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:5px 10px;font-size:12px;font-family:var(--mono);font-weight:600;cursor:pointer;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ── hero ────────────────────────────────── */
.hero{padding-block:46px 30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,58px);letter-spacing:-.02em}
.hero .lead{margin-top:16px;font-size:17px;color:var(--ink-2);max-width:56ch}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.hero-stats div b{display:block;font-family:var(--serif);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.ribbon{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-bottom:20px;max-width:340px}
.ribbon i{flex:1}

/* ── images ──────────────────────────────── */
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;isolation:isolate}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--mc,var(--accent)) 0%,transparent 72%);opacity:.16}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;opacity:0;transition:opacity .4s ease}
.ph img.in{opacity:1}
.ph .ph-txt{position:relative;z-index:1;text-align:center;padding:18px;max-width:34ch}
.ph .ph-txt .lbl{color:var(--mc,var(--accent));display:block;margin-bottom:5px}
.ph .ph-txt em{font-family:var(--serif);font-style:normal;font-size:15px;color:var(--ink-2);display:block;line-height:1.4}
.credit{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:7px;letter-spacing:.02em}
.credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.hero .ph{aspect-ratio:4/3;max-width:100%}

/* ── unit grid ───────────────────────────── */
.sec{padding-block:34px;border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:25px}
.sec-h p{color:var(--ink-2);font-size:14.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px 22px;box-shadow:var(--shadow);overflow:hidden}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mc)}
.mod h3{font-size:18px;margin-bottom:5px}
.mod .lbl{color:var(--mc)}
.mod .band{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--ink-3);margin-left:7px}
.mod p{font-size:13.5px;color:var(--ink-2);margin:6px 0 12px}
.mod ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.mod ol button{display:flex;width:100%;gap:10px;align-items:baseline;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left;font-size:14px}
.mod ol button:hover{background:var(--surface-2)}
.mod ol .n{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--mc);min-width:24px;font-variant-numeric:tabular-nums}
.mod ol .t{flex:1;min-width:0}
.tick{font-size:12px;color:var(--ok);opacity:0}
.done .tick{opacity:1}
.done .t{color:var(--ink-3)}

/* ── lesson page ─────────────────────────── */
.lesson{display:grid;grid-template-columns:184px minmax(0,1fr);gap:34px;padding-block:28px 60px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);display:flex;flex-direction:column;gap:3px}
.rail .lbl{margin-bottom:7px}
.rail a{display:flex;gap:9px;align-items:center;font-size:13px;text-decoration:none;color:var(--ink-2);padding:4px 7px;border-left:3px solid var(--rc);border-radius:0 5px 5px 0}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail a i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--rc)}
.art{min-width:0;display:flex;flex-direction:column;gap:26px}
.l-head .lbl{color:var(--mc)}
.l-head h1{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.015em;margin:7px 0 10px}
.l-head .kurz{color:var(--ink-2);font-size:16px;max-width:62ch}
.l-head .ph{aspect-ratio:21/9;margin-top:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;gap:7px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink-2);min-width:0}
.chip b{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mc);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.card>h2{font-size:19px;margin-bottom:3px}
.card>.sub{font-size:13.5px;color:var(--ink-3);margin-bottom:16px}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.goals li{display:flex;gap:11px;font-size:15px}
.goals li::before{content:"";flex:none;width:7px;height:7px;margin-top:8px;border-radius:2px;background:var(--mc);transform:rotate(45deg)}

/* grammar */
.gblock + .gblock{margin-top:24px;padding-top:24px;border-top:1px dashed var(--line)}
.gblock h3{font-size:17px;margin-bottom:8px}
.gblock .expl{font-size:15px;color:var(--ink-2);max-width:66ch}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:min(100%,460px)}
th,td{text-align:left;padding:8px 13px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--surface-2);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody td:first-child{font-weight:500}
.exs{display:flex;flex-direction:column;gap:10px;margin:14px 0 0}
.ex{border-left:3px solid var(--mc);padding:2px 0 2px 13px}
.ex .de{font-family:var(--serif);font-size:16.5px}
.ex .hint{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tip{margin-top:16px;background:var(--accent-soft);border-radius:9px;padding:12px 15px;font-size:14px;color:var(--ink)}
.tip b{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}

/* vocab */
.voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.voc>div{background:var(--surface);padding:11px 14px;min-width:0}
.w{font-weight:600;font-size:15px}
.w .art-der{color:var(--der)}.w .art-die{color:var(--die)}.w .art-das{color:var(--das)}
.gl{font-size:13px;color:var(--ink-2);margin-top:1px}
.gl .fr{color:var(--ink-3)}
.vex{font-family:var(--serif);font-size:14px;color:var(--ink-2);margin-top:5px;line-height:1.45}

/* redemittel */
.rm{display:flex;flex-direction:column;gap:15px}
.rm .fx{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mc);margin-bottom:6px}
.rm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.rm li{font-family:var(--serif);font-size:16px;padding-left:15px;position:relative}
.rm li::before{content:"»";position:absolute;left:0;color:var(--ink-3)}

/* dialogue */
.dlg{display:flex;flex-direction:column;gap:2px}
.dlg .ln{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr);gap:14px;padding:7px 0;border-top:1px solid var(--line)}
.dlg .ln:first-child{border-top:0}
.dlg .who{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--mc);padding-top:3px;overflow-wrap:anywhere}
.dlg .say{font-family:var(--serif);font-size:16.5px;min-width:0}
@media (max-width:560px){.dlg .ln{grid-template-columns:1fr;gap:1px}.dlg .who{padding-top:0}}

/* pronunciation */
.spr .fx{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mc);margin-bottom:7px}
.spr .exp{font-size:15px;margin-bottom:14px}
.spr .ex{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.spr .ex li{font-family:var(--serif);font-size:16.5px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.spr .ex li b{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--mc);margin-right:7px;text-transform:uppercase;letter-spacing:.06em}

/* writing task */
.task{font-family:var(--serif);font-size:16.5px;margin-bottom:6px}
.task-meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mc);margin-bottom:14px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cl li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;padding:6px 0;border-top:1px solid var(--line)}
.cl li:first-child{border-top:0}
.cl input{margin-top:4px;accent-color:var(--accent);flex:none;width:15px;height:15px}
.cl label{cursor:pointer}

/* exercises */
.q{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.qt{display:flex;gap:11px;font-size:15.5px;align-items:baseline}
.qt .qn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:11px 0 0 26px}
.opt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:14px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.gaprow{display:flex;gap:8px;margin:11px 0 0 26px;flex-wrap:wrap}
.gaprow input{flex:1 1 190px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;color:var(--ink)}
.gaprow input.right{border-color:var(--ok);background:var(--ok-soft)}
.gaprow input.wrong{border-color:var(--no);background:var(--no-soft)}
.gaprow button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer}
.fb{margin:9px 0 0 26px;font-size:13.5px;padding:9px 13px;border-radius:8px;display:none}
.fb.on{display:block}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--no-soft);color:var(--no)}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.bar{flex:1 1 110px;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s ease}

/* nav */
.pager{display:flex;gap:11px;justify-content:space-between;flex-wrap:wrap}
.pager a{flex:1 1 210px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.pager a:hover{border-color:var(--line-strong)}
.pager .lbl{display:block;margin-bottom:3px}
.pager b{font-family:var(--serif);font-size:15.5px;font-weight:600;display:block}
.pager .nx{text-align:right}
.mark{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 16px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-2)}
.mark button{margin-left:auto}

/* search */
.find{position:relative;flex:1 1 170px;max-width:260px}
.find input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font:inherit;font-size:13px;color:var(--ink)}
.hits{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:16px}
.hits button{background:var(--surface);border:0;padding:11px 15px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:baseline;font-size:14px}
.hits button:hover{background:var(--surface-2)}
.hits .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mc);min-width:34px;flex:none}
.hits .why{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right;flex:none}
.empty{color:var(--ink-3);font-size:14px;padding:18px 0}

/* foot */
.foot{border-top:1px solid var(--line);padding-block:26px 40px;font-size:13px;color:var(--ink-3);display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
.foot p{max-width:62ch}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:26px;padding-block:30px 22px}
  .lesson{grid-template-columns:1fr;gap:22px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:5px}
  .rail .lbl{display:none}
  .rail a{border-left:0;border-bottom:3px solid var(--rc);border-radius:5px 5px 0 0;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" id="home-btn"><b>deutshsprache</b><span>A1</span></button>
    <div class="top-sp"></div>
    <div class="find"><input id="find" type="search" placeholder="Thema oder Grammatik suchen…" aria-label="Kurs durchsuchen"></div>
    <div class="seg" role="group" aria-label="Übersetzungen">
      <button id="g-en" aria-pressed="true">EN</button>
      <button id="g-fr" aria-pressed="false">FR</button>
    </div>
    <button class="ghost" id="theme" aria-label="Design umschalten">◐</button>
  </div>
</header>

<main id="app" class="shell"></main>

<footer class="foot shell">
  <p id="foot-note"></p>

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function mc(n){ return 'var(--m' + n + ')'; }
function photoUrl(b){
  return IMG_LOCAL ? IMG_BASE + b.datei
                   : IMG_BASE + b.id + '?auto=format&fit=crop&w=1400&q=72';
}
function img(b, cls){
  return '<figure class="ph ' + (cls||'') + '" style="margin:0">'
    + '<div class="ph-txt"><span class="lbl">Foto</span><em>' + esc(b.alt) + '</em></div>'
    + '<img src="' + esc(photoUrl(b)) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
    + '</figure>';
}
/* If a photo cannot load (offline, or a host that blocks third-party images),
   the designed caption panel underneath stays visible instead of a broken frame. */
function wirePhotos(){
  app.querySelectorAll('.ph img').forEach(function(im){
    function ok(){ im.classList.add('in'); }
    function fail(){ im.hidden = true; }
    if(im.complete){ (im.naturalWidth > 0 ? ok : fail)(); return; }
    im.addEventListener('load', ok);
    im.addEventListener('error', fail);
  });
}
function credit(b){
  return '<p class="credit">Foto: <a href="' + esc(b.profil) + '" target="_blank" rel="noopener">' + esc(b.fotograf)
    + '</a> · <a href="https://unsplash.com/" target="_blank" rel="noopener">Unsplash</a></p>';
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[….]+/g, ' ')
    .replace(/[^a-zäöüß0-9\s-]/g, '')
    .replace(/\s+/g, ' ').trim();
}
function artikelWrap(w){
  return w.replace(/^(der|die|das)\b/, function(a){ return '<span class="art-' + a + '">' + a + '</span>'; });
}

/* ---------- views ---------- */
function viewHome(){
  var nW = L.reduce(function(a,l){ return a + l.wortschatz.length; }, 0),
      nU = L.reduce(function(a,l){ return a + l.uebungen.length; }, 0);

  var ribbon = M.map(function(m){ return '<i style="background:' + mc(m.nr) + '"></i>'; }).join('');

  var mods = M.map(function(m){
    var items = m.lektionen.map(function(n){
      var l = byNr[n];
      return '<li><button data-go="l' + n + '" class="' + (done[n] ? 'done' : '') + '">'
        + '<span class="n">' + esc(l.code) + '</span>'
        + '<span class="t">' + esc(l.thema) + '</span>'
        + '<span class="tick">✓</span></button></li>';
    }).join('');
    return '<article class="mod" style="--mc:' + mc(m.nr) + '">'
      + '<span class="lbl">Modul ' + m.nr + '</span>'
      + (m.band ? '<span class="band">' + esc(m.band) + '</span>' : '')
      + '<h3>' + esc(m.titel) + '</h3>'
      + '<p>' + esc(m.beschreibung) + '</p>'
      + '<ol>' + items + '</ol></article>';
  }).join('');

  app.innerHTML =
    '<section class="hero">'
    + '<div><div class="ribbon">' + ribbon + '</div>'
    + '<h1>' + esc(C.meta.titel) + '</h1>'
    + '<p class="lead">Das vollständige A1-Programm in acht Modulen: jede Lektion mit Lernzielen, erklärter Grammatik, thematischem Wortschatz, einem Aussprachetraining, Redemitteln, einem Modelldialog, einer Schreibaufgabe und Übungen mit sofortiger Auswertung.</p>'
    + '<div class="hero-stats">'
      + '<div><b>' + L.length + '</b><span class="lbl">Lektionen</span></div>'
      + '<div><b>' + M.length + '</b><span class="lbl">Module</span></div>'
      + '<div><b>' + nW + '</b><span class="lbl">Wörter</span></div>'
      + '<div><b>' + nU + '</b><span class="lbl">Übungen</span></div>'
    + '</div></div>'
    + '<div>' + img(C.meta.hero) + credit(C.meta.hero) + '</div>'
    + '</section>'
    + '<section class="sec"><div class="sec-h"><h2>Die acht Module</h2>'
    + '<p>Vorbereitung auf Start Deutsch 1 / Goethe-Zertifikat A1, telc Deutsch A1 und ÖSD Zertifikat A1. Fortschritt wird in diesem Browser gespeichert.</p></div>'
    + '<div class="mods">' + mods + '</div></section>'
    + '<section class="sec" id="hits-sec" hidden><div class="sec-h"><h2>Suchergebnisse</h2></div><div id="hits"></div></section>';

  wirePhotos();
  var q = document.getElementById('find').value.trim();
  if(q) search(q);
  window.scrollTo(0, 0);
}

function viewLesson(nr){
  var l = byNr[nr];
  if(!l){ viewHome(); return; }
  var m = M.find(function(x){ return x.nr === l.modul; });
  var col = mc(l.modul);

  var rail = m.lektionen.map(function(n){
    return '<a href="#l' + n + '" class="' + (n === nr ? 'on' : '') + '" style="--rc:' + col + '">'
      + '<i>' + esc(byNr[n].code) + '</i>' + esc(byNr[n].thema) + '</a>';
  }).join('');

  var goals = l.lernziele.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('');

  var gram = l.grammatik.map(function(g){
    var tab = '';
    if(g.tabelle){
      tab = '<div class="tw"><table><thead><tr>'
        + g.tabelle.kopf.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + g.tabelle.zeilen.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
          }).join('')
        + '</tbody></table></div>';
    }
    var ex = '<div class="exs">' + g.beispiele.map(function(b){
      return '<div class="ex"><div class="de">' + esc(b.de) + '</div>'
        + (b.hinweis ? '<div class="hint">' + esc(b.hinweis) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
    return '<div class="gblock"><h3>' + esc(g.titel) + '</h3>'
      + '<p class="expl">' + esc(g.erklaerung) + '</p>' + tab + ex
      + (g.tipp ? '<div class="tip"><b>Merke</b>' + esc(g.tipp) + '</div>' : '')
      + '</div>';
  }).join('');

  var voc = l.wortschatz.map(function(w){
    var gl = [];
    if(glossen.en) gl.push('<span class="en">' + esc(w.en) + '</span>');
    if(glossen.fr) gl.push('<span class="fr">' + esc(w.fr) + '</span>');
    return '<div><div class="w">' + artikelWrap(esc(w.wort)) + '</div>'
      + (gl.length ? '<div class="gl">' + gl.join(' · ') + '</div>' : '')
      + '<div class="vex">' + esc(w.beispiel) + '</div></div>';
  }).join('');

  var rm = l.redemittel.map(function(r){
    return '<div><div class="fx">' + esc(r.funktion) + '</div><ul>'
      + r.saetze.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
  }).join('');

  var a = l.aussprache;
  var spr = '<div class="spr"><div class="fx">' + esc(a.fokus) + '</div>'
    + '<p class="exp">' + esc(a.erklaerung) + '</p>'
    + '<ul class="ex">' + a.beispiele.map(function(b){
        var p = String(b).split(/:\s*/);
        return p.length > 1
          ? '<li><b>' + esc(p.shift()) + '</b>' + esc(p.join(': ')) + '</li>'
          : '<li>' + esc(b) + '</li>';
      }).join('') + '</ul></div>';

  var dlg = '<div class="dlg">' + l.dialog.zeilen.map(function(z){
    return '<div class="ln"><div class="who">' + esc(z.wer) + '</div><div class="say">' + esc(z.text) + '</div></div>';
  }).join('') + '</div>';

  var s = l.schreibaufgabe;
  var task = '<p class="task">' + esc(s.aufgabe) + '</p>'
    + '<p class="task-meta">Umfang: ' + esc(s.woerter) + '</p>'
    + '<ul class="cl">' + s.checkliste.map(function(c, i){
        var id = 'cl' + nr + '-' + i;
        return '<li><input type="checkbox" id="' + id + '"><label for="' + id + '">' + esc(c) + '</label></li>';
      }).join('') + '</ul>';

  var qs = l.uebungen.map(function(u, i){
    var body;
    if(u.typ === 'mc'){
      body = '<div class="opts">' + u.optionen.map(function(o, j){
        return '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + esc(o) + '</button>';
      }).join('') + '</div>';
    } else {
      body = '<div class="gaprow"><input type="text" id="q' + nr + '-' + i + '" data-q="' + i
        + '" autocomplete="off" spellcheck="false" placeholder="Antwort eingeben…">'
        + '<button class="chk" data-q="' + i + '">Prüfen</button></div>';
    }
    return '<div class="q" data-qi="' + i + '">'
      + '<div class="qt"><span class="qn">' + (i + 1) + '</span><span>' + esc(u.frage) + '</span></div>'
      + body + '<div class="fb" data-fb="' + i + '"></div></div>';
  }).join('');

  var prev = nr > 1 ? byNr[nr - 1] : null, next = nr < L.length ? byNr[nr + 1] : null;

  app.innerHTML = '<div class="lesson" style="--mc:' + col + '">'
    + '<nav class="rail"><span class="lbl">Modul ' + m.nr + (m.band ? ' · ' + esc(m.band) : '') + '</span>' + rail + '</nav>'
    + '<div class="art">'
      + '<header class="l-head"><span class="lbl">Lektion ' + esc(l.code) + ' · ' + esc(l.thema) + '</span>'
      + '<h1>' + esc(l.titel) + '</h1><p class="kurz">' + esc(l.kurz) + '</p>'
      + '<div class="chips"><span class="chip"><b>Textsorte</b>' + esc(l.textsorte) + '</span>'
      + '<span class="chip"><b>Prüfung</b>' + esc(l.pruefung) + '</span></div>'
      + img(l.bild) + credit(l.bild) + '</header>'

      + '<section class="card"><h2>Lernziele</h2><p class="sub">Das können Sie nach dieser Lektion.</p>'
      + '<ul class="goals">' + goals + '</ul></section>'

      + '<section class="card"><h2>Grammatik</h2><p class="sub">Regel, Formen und Beispielsätze.</p>' + gram + '</section>'

      + '<section class="card"><h2>Wortschatz</h2><p class="sub">' + l.wortschatz.length
        + ' Wörter zum Thema · der / die / das farbig markiert.</p>'
      + '<div class="voc">' + voc + '</div></section>'

      + '<section class="card"><h2>Aussprache</h2><p class="sub">Sprechen Sie die Beispiele laut mit.</p>'
      + spr + '</section>'

      + '<section class="card"><h2>Dialog</h2><p class="sub">' + esc(l.dialog.titel)
        + ' · Modellgespräch zur Lektion.</p>' + dlg + '</section>'

      + '<section class="card"><h2>Redemittel</h2><p class="sub">Fertige Wendungen für Gespräch und Text.</p>'
      + '<div class="rm">' + rm + '</div></section>'

      + '<section class="card"><h2>Schreibaufgabe</h2><p class="sub">Prüfungsnahe Textproduktion mit Checkliste.</p>'
      + task + '</section>'

      + '<section class="card" id="ue"><h2>Übungen</h2><p class="sub">' + l.uebungen.length
        + ' Aufgaben mit sofortiger Rückmeldung.</p>' + qs
      + '<div class="score"><span id="sc-txt">Noch keine Aufgabe gelöst.</span>'
      + '<span class="bar"><i id="sc-bar"></i></span></div></section>'

      + '<div class="mark"><span>Lektion ' + esc(l.code) + (done[nr] ? ' ist als erledigt markiert.' : ' noch offen.') + '</span>'
      + '<button class="ghost" id="mk" aria-pressed="' + (done[nr] ? 'true' : 'false') + '">'
      + (done[nr] ? '✓ Erledigt' : 'Als erledigt markieren') + '</button></div>'

      + '<nav class="pager">'
      + (prev ? '<a href="#l' + prev.nr + '"><span class="lbl">← Lektion ' + esc(prev.code) + '</span><b>' + esc(prev.thema) + '</b></a>' : '<span></span>')
      + (next ? '<a class="nx" href="#l' + next.nr + '"><span class="lbl">Lektion ' + esc(next.code) + ' →</span><b>' + esc(next.thema) + '</b></a>' : '<span></span>')
      + '</nav>'
    + '</div></div>';

  wirePhotos();
  wireQuiz(l);
  var mk = document.getElementById('mk');
  mk.addEventListener('click', function(){
    if(done[nr]) delete done[nr]; else done[nr] = 1;
    saveDone();
    viewLesson(nr);
  });
  window.scrollTo(0, 0);
}

/* ---------- quiz ---------- */
function wireQuiz(l){
  var state = {};
  function tally(){
    var ks = Object.keys(state), right = 0;
    ks.forEach(function(k){ if(state[k]) right++; });
    var pct = l.uebungen.length ? Math.round(right / l.uebungen.length * 100) : 0;
    document.getElementById('sc-bar').style.width = pct + '%';
    document.getElementById('sc-txt').textContent = ks.length
      ? right + ' von ' + l.uebungen.length + ' richtig'
      : 'Noch keine Aufgabe gelöst.';
  }
  function feedback(i, ok, u){
    var fb = app.querySelector('[data-fb="' + i + '"]');
    fb.className = 'fb on ' + (ok ? 'good' : 'bad');
    var sol = u.typ === 'mc' ? u.loesung : u.loesung[0];
    fb.textContent = (ok ? 'Richtig. ' : 'Noch nicht. Lösung: ' + sol + '. ') + u.erklaerung;
    state[i] = ok;
    tally();
  }
  app.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.q, u = l.uebungen[i];
      var wrap = b.parentElement;
      if(wrap.dataset.lock) return;
      wrap.dataset.lock = '1';
      var ok = u.optionen[+b.dataset.o] === u.loesung;
      wrap.querySelectorAll('.opt').forEach(function(x){
        x.disabled = true;
        if(u.optionen[+x.dataset.o] === u.loesung) x.classList.add('right');
      });
      if(!ok) b.classList.add('wrong');
      feedback(i, ok, u);
    });
  });
  function checkGap(i){
    var u = l.uebungen[i];
    var inp = app.querySelector('input[data-q="' + i + '"]');
    var v = norm(inp.value);
    if(!v) return;
    var ok = u.loesung.some(function(s){ return norm(s) === v; });
    inp.classList.remove('right', 'wrong');
    inp.classList.add(ok ? 'right' : 'wrong');
    feedback(i, ok, u);
  }
  app.querySelectorAll('.chk').forEach(function(b){
    b.addEventListener('click', function(){ checkGap(+b.dataset.q); });
  });
  app.querySelectorAll('.gaprow input').forEach(function(inp){
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); checkGap(+inp.dataset.q); }
    });
  });
}

/* ---------- search ---------- */
function search(q){
  var sec = document.getElementById('hits-sec'), box = document.getElementById('hits');
  if(!sec) return;
  var n = norm(q);
  if(n.length < 2){ sec.hidden = true; return; }
  var out = [];
  L.forEach(function(l){
    var why = null;
    if(norm(l.thema).indexOf(n) > -1 || norm(l.titel).indexOf(n) > -1 || norm(l.code) === n) why = 'Thema';
    if(!why && l.grammatik.some(function(g){ return norm(g.titel).indexOf(n) > -1; })) why = 'Grammatik';
    if(!why && norm(l.textsorte).indexOf(n) > -1) why = 'Textsorte';
    if(!why && norm(l.dialog.titel).indexOf(n) > -1) why = 'Dialog';
    if(!why && norm(l.aussprache.fokus).indexOf(n) > -1) why = 'Aussprache';
    if(!why && l.wortschatz.some(function(w){
      return norm(w.wort).indexOf(n) > -1 || norm(w.en).indexOf(n) > -1 || norm(w.fr).indexOf(n) > -1;
    })) why = 'Wortschatz';
    if(why) out.push({ l: l, why: why });
  });
  sec.hidden = false;
  box.innerHTML = out.length
    ? out.map(function(h){
        return '<button data-go="l' + h.l.nr + '" style="--mc:' + mc(h.l.modul) + '">'
          + '<span class="n">' + esc(h.l.code) + '</span>'
          + '<span>' + esc(h.l.thema) + ' — ' + esc(h.l.grammatik.map(function(g){ return g.titel; }).join(', ')) + '</span>'
          + '<span class="why">' + h.why + '</span></button>';
      }).join('')
    : '<p class="empty">Nichts gefunden. Versuchen Sie es mit „Adjektiv", „Perfekt", „Hotel" oder „Wetter".</p>';
}

/* ---------- routing & chrome ---------- */
function route(){
  var h = (location.hash || '').replace('#', '');
  var m = /^l(\d{1,2})$/.exec(h);
  if(m) viewLesson(+m[1]); else viewHome();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-go]');
  if(b){ location.hash = '#' + b.dataset.go; }
});
document.getElementById('home-btn').addEventListener('click', function(){
  if(location.hash) location.hash = ''; else viewHome();
});
document.getElementById('find').addEventListener('input', function(e){
  if(location.hash){ location.hash = ''; setTimeout(function(){ search(e.target.value); }, 0); }
  else search(e.target.value);
});
function glossBtn(id, key){
  var b = document.getElementById(id);
  b.setAttribute('aria-pressed', glossen[key] ? 'true' : 'false');
  b.addEventListener('click', function(){
    glossen[key] = !glossen[key];
    b.setAttribute('aria-pressed', glossen[key] ? 'true' : 'false');
    ls('dsa2.gloss', JSON.stringify(glossen));
    route();
  });
}
glossBtn('g-en', 'en'); glossBtn('g-fr', 'fr');

var themeBtn = document.getElementById('theme');
var saved = ls('dsa2.theme');
if(saved) document.documentElement.setAttribute('data-theme', saved);
themeBtn.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var isDark = cur ? cur === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var nx = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  ls('dsa2.theme', nx);
});

document.getElementById('foot-note').textContent = C.meta.hinweis;
document.getElementById('foot-img').textContent = C.meta.bildquelle + ' · ' + C.meta.herausgeber + ' · Version ' + C.meta.version;

route();
})();
</script>
