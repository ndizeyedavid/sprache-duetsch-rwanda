services:
  postgres:
    image: postgres:16-alpine
    container_name: sparch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparch
      POSTGRES_PASSWORD: sparch_dev
      POSTGRES_DB: sparch_rw
    ports:
      - "5432:5432"
    volumes:
      - sparch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparch -d sparch_rw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sparch-pgdata:
